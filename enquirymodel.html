<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
        <style>
            *{
                margin:0px;
                padding:0px;
                
            }
            .modeldiv{
                position:fixed;
                font-family:sans-serif;
                left:50%;
                height:350px;
                width:350px;
                top:-1000px;
                transition:2s;
                transform:translate(-50%,-50%);
                box-shadow:0px 0px 10px 2px #ec6262;
                }
                .modeldiv  h2{
                   text-align:center;
                   padding:10px 0px;
                   position: relative;
                   border-bottom:1px solid #cccc; 
                }
                .modeldiv span{
                    position:absolute;
                    right:10px;
                    cursor:pointer;
                }

        </style>
    </head>
    <body>
        <button>show model</button>
        <div class="modeldiv">
            <h2> enquiry now <span>&times</span></h2>
            <form action="">
            </form>
        </div>
    </body>
    <script>
        let btn = document.querySelector("button")
        let closebtn = document.querySelector(".modeldiv span")
        let modelEvent = document.querySelector(".modeldiv")

        setTimeout(()=>{
            modelEvent.style.top="50%"
        },2000)
        

        btn.addEventListener("click",()=>{
            modelEvent.style.top="50%"
        })
        closebtn.addEventListener("click",()=>{
            modelEvent.style.top="-1000px"
        })
    </script>
</html>
