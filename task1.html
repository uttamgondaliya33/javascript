<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
        <style>
            *{
                margin:0px;
                padding:0px;
                font-family:san-sarif;
                box-sizing:border-box;
            }
            .main{
                width:1000px;
                margin:auto;
            }
            .main textarea{
                width:100px;
                height:200px;
                padding:20px;
            }
            
        </style>

    </head>
    <body>
       
        <div class="main">
            <textarea name="" id=""></textarea>
        
        <h2>Length -<span><span></h2>
        <div id="resDiv"></div>
    </body>
    <script>
        let textareaElement = document.querySelector("textarea")
        let lenElement=document.querySelector("h2 span")
        let resDivElement=document.querySelector("#resDiv")

        textareaElement.addEventListener("keyup",()=>{
            resDivElement.innerHTML = textareaElement.value
            lenElement.innerHTML=textareaElement.value.length
        })
    </script>
</html>
