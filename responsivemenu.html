<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Navbar</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:sans-serif;
            text-decoration:none;
            list-style:none;
        }

        header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:15px 30px;
            box-shadow:0 2px 10px #ccc;
            position:relative;
        }

        header nav ul{
            display:flex;
            gap:30px;
        }

        header nav ul li a{
            color:#000;
            font-weight:bold;
            text-transform:uppercase;
        }

        /* Hamburger Icon */
        .mIcon{
            display:none;
            font-size:28px;
            cursor:pointer;
            z-index:1001;
        }

        @media(max-width:575px){

            .mIcon{
                display:block;
            }

            nav{
                position:fixed;
                top:0;
                left:-100%;
                width:80%;
                height:100vh;
                background:#ddd;
                padding:80px 20px;
                transition:.4s;
                z-index:1000;
            }

            nav ul{
                display:flex;
                flex-direction:column;
                gap:25px;
            }

            .showMenu{
                left:0;
            }
        }
    </style>
</head>

<body>

<header>

    <figure>
        <img width="100"
            src="https://thumbs.dreamstime.com/b/go-to-web-icon-trendy-flat-style-isolated-grey-background-website-pictogram-internet-symbol-your-web-site-design-logo-137568495.jpg">
    </figure>

    <i class="fa-solid fa-bars mIcon"></i>

    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Course</a></li>
            <li><a href="#">Gallery</a></li>
            <li><a href="#">Contact Us</a></li>
        </ul>
    </nav>

</header>

<script>

const mIcon = document.querySelector(".mIcon");
const nav = document.querySelector("nav");

mIcon.addEventListener("click", () => {

    nav.classList.toggle("showMenu");

    // Change icon
    if(nav.classList.contains("showMenu")){
        mIcon.classList.remove("fa-bars");
        mIcon.classList.add("fa-xmark");
    }else{
        mIcon.classList.remove("fa-xmark");
        mIcon.classList.add("fa-bars");
    }

});

</script>

</body>
</html>
