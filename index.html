<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Document</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
        <style>
        *{
            margin: 0px;
            padding: 0px;
            font-family: sans-serif;
        }
        .formSection{
            display: grid;
            padding: 30px;
            grid-template-columns:20% auto;
            gap:30px;
        }
        .formSection form{
            padding:15px;
            box-shadow: 0px 0px 2px #b29999;
        }
        .formSection form h3
        {
            text-align: center;
            padding-bottom: 12px;
        }
        .inputOuter label{
            display:block;
            font-size:14px;
        }
        .inputOuter input{
            width: 100%;
            height:30px;
        }
        .formSection form button{
            width: 100%;
            border: none;
            background-color: blue;
            color: white;
            padding: 8px 0px;
            
        }
        table{
            width: 100%;
            border-collapse: collapse;
        }
        th, td{
            text-align:left;
            padding:8px;

        }
        button{
            background-color: blue;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;

        }
        th{
            background-color:#f2f2f2;
        }
        .error{
            color: red;
        }

       </style>
    </head>
    <body>
        <section class="formSection">
            <form action="">
                <h3>Enquire Now</h3>
                <div class="error"></div>
                <div class="inputOuter">
                    <label for="">userName</label>
                    <input type="text" name="userName" id="" required>
                </div>
                <div class="inputOuter">
                    <label for="">Email</label>
                    <input type="email" name="userEmail" id="" required>
                </div>
                <div class="inputOuter">
                    <label for="">phone</label>
                    <input type="text" name="userPhone" id="" required>
                </div>
                <button type="submit">Save</button>
            </form>
            <div>
                <table border="1" cellspacing="0" cellpadding="10">
                    <thead>
                        <tr>
                            <th>Sr. No</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </body>
    
    <script>
       let formElement = document.querySelector(".formSection form");

let userData = [];
let errorMsg = document.querySelector(".error")

formElement.addEventListener("submit", (event) => {
    event.preventDefault();

    let userName = event.target.userName.value;
    let userEmail = event.target.userEmail.value;
    let userPhone = event.target.userPhone.value;

    let userObject = {
        userName,
        userEmail,
        userPhone
    };

    let checkMyEmail = userData.find(
        (item) => item.userEmail === userEmail
    );

    if (checkMyEmail) {
        errorMsg.innerHTML = "Email Already Exists"
        setTimeout(() => {
            errorMsg.innerHTML = ""
        }, 2000)

    } else {
        userData.push(userObject);
        storeData()
    }

    event.target.reset();
});
let tableBody = document.querySelector("#tableBody")
let storeData = () => {
    let tableRow = ''
    userData.forEach((items, index) => {
        tableRow += `
                <tr>
                    <td>${index+1}</td>
                    <td>${items.userName}</td>
                    <td>${items.userEmail}</td>
                    <td>${items.userPhone}</td>                           
                    <td><button data-id="${index}">Delete</button></td>
                </tr> `

    })
    tableBody.innerHTML = tableRow
}
tableBody.addEventListener("click", (e) => {
    if (e.target.tagName === "BUTTON") {
        if (confirm("Are you sure want to delete?")) {

        }
        let delID = Number(e.target.getAttribute("data-id"));

        userData.splice(delID, 1);

        storeData();
    }
});
    </script>
</html>
