<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Calculator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', sans-serif;
    background: #1a1a2e;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .calculator {
    background: #16213e;
    border-radius: 20px;
    padding: 24px;
    width: 320px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  /* Display */
  .display {
    background: #0f3460;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
    text-align: right;
    min-height: 90px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }

  .previous { color: #888; font-size: 14px; margin-bottom: 6px; min-height: 20px; }
  .current { color: #fff; font-size: 36px; font-weight: 600; word-break: break-all; }

  /* Buttons */
  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  button {
    height: 58px;
    border: none;
    border-radius: 12px;
    font-size: 20px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.15s;
    color: #fff;
    background: #1a1a40;
  }

  button:hover { background: #2a2a5a; }
  button:active { transform: scale(0.95); }

  /* Special button colors */
  .operator { background: #e94560; }
  .operator:hover { background: #ff6b81; }

  .equals { background: #f5a623; color: #1a1a2e; }
  .equals:hover { background: #ffc048; }

  .clear { background: #533483; }
  .clear:hover { background: #6a45a8; }

  .wide { grid-column: span 2; }
</style>
</head>
<body>

<div class="calculator">
  <div class="display">
    <div class="previous" id="previous"></div>
    <div class="current" id="current">0</div>
  </div>
  <div class="buttons">
    <button class="clear" onclick="clearAll()">AC</button>
    <button onclick="deleteLast()">DEL</button>
    <button class="operator" onclick="chooseOperator('%')">%</button>
    <button class="operator" onclick="chooseOperator('/')">/</button>

    <button onclick="appendNumber('7')">7</button>
    <button onclick="appendNumber('8')">8</button>
    <button onclick="appendNumber('9')">9</button>
    <button class="operator" onclick="chooseOperator('*')">x</button>

    <button onclick="appendNumber('4')">4</button>
    <button onclick="appendNumber('5')">5</button>
    <button onclick="appendNumber('6')">6</button>
    <button class="operator" onclick="chooseOperator('-')">-</button>

    <button onclick="appendNumber('1')">1</button>
    <button onclick="appendNumber('2')">2</button>
    <button onclick="appendNumber('3')">3</button>
    <button class="operator" onclick="chooseOperator('+')">+</button>

    <button class="wide" onclick="appendNumber('0')">0</button>
    <button onclick="appendDot()">.</button>
    <button class="equals" onclick="calculate()">=</button>
  </div>
</div>

<script>
  // --- State ---
  let current = '0';      // What user sees now
  let previous = '';       // The first number
  let operator = '';       // +, -, *, /, %

  // --- DOM ---
  const currentEl = document.getElementById('current');
  const previousEl = document.getElementById('previous');

  // --- Update screen ---
  function updateScreen() {
    currentEl.textContent = current;
    if (operator) {
      previousEl.textContent = previous + ' ' + operator;
    } else {
      previousEl.textContent = '';
    }
  }

  // --- Add a digit ---
  function appendNumber(num) {
    // Don't add extra zeros at the start
    if (current === '0' && num !== '.') {
      current = num;
    } else {
      current += num;
    }
    updateScreen();
  }

  // --- Add decimal dot ---
  function appendDot() {
    if (current.includes('.')) return; // already has dot
    current += '.';
    updateScreen();
  }

  // --- Pick an operator (+, -, *, /, %) ---
  function chooseOperator(op) {
    // If there's a pending operation, solve it first
    if (operator && previous !== '') {
      calculate();
    }
    operator = op;
    previous = current;
    current = '0'; // reset for next number input
    updateScreen();
  }

  // --- Do the math ---
  function calculate() {
    if (!operator || previous === '') return;

    const a = parseFloat(previous);
    const b = parseFloat(current);
    let result = 0;

    if (operator === '+') result = a + b;
    else if (operator === '-') result = a - b;
    else if (operator === '*') result = a * b;
    else if (operator === '/') {
      if (b === 0) {
        current = 'Error';
        operator = '';
        previous = '';
        updateScreen();
        return;
      }
      result = a / b;
    }
    else if (operator === '%') result = a % b;

    // Round to avoid long decimals
    result = Math.round(result * 1e10) / 1e10;
    current = String(result);
    operator = '';
    previous = '';
    updateScreen();
  }

  // --- Clear everything ---
  function clearAll() {
    current = '0';
    previous = '';
    operator = '';
    updateScreen();
  }

  // --- Delete last character ---
  function deleteLast() {
    if (current.length === 1 || current === 'Error') {
      current = '0';
    } else {
      current = current.slice(0, -1);
    }
    updateScreen();
  }

  // --- Keyboard support ---
  document.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
    else if (e.key === '.') appendDot();
    else if (e.key === '+') chooseOperator('+');
    else if (e.key === '-') chooseOperator('-');
    else if (e.key === '*') chooseOperator('*');
    else if (e.key === '/') { e.preventDefault(); chooseOperator('/'); }
    else if (e.key === '%') chooseOperator('%');
    else if (e.key === 'Enter' || e.key === '=') calculate();
    else if (e.key === 'Escape') clearAll();
    else if (e.key === 'Backspace') deleteLast();
  });
</script>
</body>
</html>
